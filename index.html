<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방과후 컴퓨터 교실 피드백 시스템 (URL 연동 완료)</title>
    <!-- 부트스트랩 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif; }
        .main-container { max-width: 1200px; margin: 30px auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .header-title { color: #1e3a8a; border-bottom: 3px solid #1e3a8a; padding-bottom: 10px; margin-bottom: 30px; }
        .config-box { background-color: #eff6ff; padding: 20px; border-radius: 8px; border: 1px solid #bfdbfe; margin-bottom: 25px; }
        .table th { background-color: #f1f5f9; color: #334155; text-align: center; font-size: 0.95rem; }
        .table td { vertical-align: middle; }
        .radio-group { display: flex; gap: 12px; justify-content: center; }
        .btn-primary { background-color: #1e3a8a; border: none; }
        .btn-primary:hover { background-color: #1d4ed8; }
        .success-box { background-color: #d1e7dd; border: 1px solid #badbcc; padding: 15px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 20px; color: #0f5132; }
    </style>
</head>
<body>

<div class="container main-container">
    <h2 class="header-title">🚀 방과후 컴퓨터 교실 학습 통지서 일괄 생성기</h2>
    
    <div class="success-box">
        <strong>✅ 구글 시트 주소 연동 완료 버전:</strong><br>
        보내주신 구글 웹앱 주소가 내부에 안전하게 삽입되었습니다. 이제 별도의 코드 수정 없이 이 파일 그대로 사용하시면 됩니다!
    </div>

    <!-- 1 구역: 상단 공통 설정 -->
    <div class="config-box row g-3">
        <div class="col-md-6">
            <label class="form-label fw-bold text-dark">1. 수업반 이름 입력</label>
            <input type="text" id="className" class="form-control" placeholder="예: 대박초등학교 컴퓨터A반">
        </div>
        <div class="col-md-6">
            <label class="form-label fw-bold text-dark">2. 교재 선택</label>
            <select id="textbookSelect" class="form-select" onchange="loadEvaluationFields()">
                <option value="">-- 교재를 로딩 중입니다... --</option>
            </select>
        </div>
    </div>

    <!-- 2 구역: 학생 입력 테이블 -->
    <div class="mb-4">
        <h4 class="fw-bold text-secondary mb-3">3. 학생별 평가 일괄 입력</h4>
        <div class="table-responsive">
            <table class="table table-bordered align-middle" id="studentTable">
                <thead>
                    <tr id="tableHeader">
                        <th style="width: 15%;">학생 이름</th>
                        <th style="width: 25%;">강사 커스텀 한줄 의견 (선택)</th>
                        <th style="width: 8%;">관리</th>
                    </tr>
                </thead>
                <tbody id="studentGrid">
                </tbody>
            </table>
        </div>
        <button type="button" class="btn btn-outline-secondary btn-sm fw-bold" onclick="addStudentRow()">+ 학생 추가하기</button>
    </div>

    <!-- 3 구역: 출력 버튼 -->
    <div class="text-center mt-5">
        <button type="button" class="btn btn-primary btn-lg px-5 py-3 fw-bold shadow-sm" onclick="generateAndZip()">
            📦 모든 학생 리포트 일괄 다운로드 (ZIP)
        </button>
    </div>
</div>

<!-- 필수 라이브러리 CDN -->
<script src="https://unpkg.com/docx@8.5.0/build/index.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<script>
    // 🔗 보내주신 정식 구글 웹 앱 URL 주소가 자동으로 조립되었습니다.
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwNzBnj0faJtuKJUT-HLIm-TY_3JP-Jk09uv9NOMEHF0AxhQyIh-mIPIrhsi78SPGe8/exec";
    
    let currentEvaluationItems = []; 
    let evaluationPoolData = {}; 

    // 페이지가 열리자마자 자동으로 구글 시트에서 Y 상태인 교재 목록을 가져옵니다.
    window.onload = function() {
        fetch(`${WEB_APP_URL}?action=get_books`)
        .then(res => res.json())
        .then(data => {
            const select = document.getElementById("textbookSelect");
            select.innerHTML = '<option value="">-- 교재를 선택하세요 --</option>';
            
            for(let i = 1; i < data.length; i++) {
                let useStatus = String(data[i][2]).trim().toUpperCase();
                if(useStatus === "Y") { 
                    let option = document.createElement("option");
                    option.value = data[i][0]; 
                    option.text = data[i][1];  
                    select.appendChild(option);
                }
            }
        }).catch(err => alert("구글 시트 로드 실패: 구글 앱스 스크립트의 새 배포 승인 및 '모든 사람' 권한 설정을 다시 확인하세요."));
    };

    // 교재를 선택하면 항목을 동적으로 깔아줍니다.
    function loadEvaluationFields() {
        const bookId = document.getElementById("textbookSelect").value;
        if(!bookId) return;

        fetch(`${WEB_APP_URL}?action=get_evals&book_id=${bookId}`)
        .then(res => res.json())
        .then(data => {
            currentEvaluationItems = [];
            evaluationPoolData = {};

            data.forEach(row => {
                const item = row[1];  
                const level = row[2]; 
                const text = row[3];  
                
                if(!currentEvaluationItems.includes(item)) {
                    currentEvaluationItems.push(item);
                }
                if(!evaluationPoolData[item]) evaluationPoolData[item] = {};
                evaluationPoolData[item][level] = text;
            });

            const header = document.getElementById("tableHeader");
            header.innerHTML = '<th style="width: 15%;">학생 이름</th>';
            currentEvaluationItems.forEach(item => {
                let th = document.createElement("th");
                th.innerText = item;
                header.appendChild(th);
            });
            header.innerHTML += '<th style="width: 25%;">강사 커스텀 한줄 의견 (선택)</th><th style="width: 8%;">관리</th>';

            document.getElementById("studentGrid").innerHTML = "";
            addStudentRow();
        });
    }

    let rowCounter = 0;
    function addStudentRow() {
        const tbody = document.getElementById("studentGrid");
        const textbook = document.getElementById("textbookSelect").value;
        
        if(!textbook) { alert("먼저 위에서 교재를 선택해 주세요!"); return; }

        rowCounter++;
        let tr = document.createElement("tr");
        tr.className = "student-row";
        tr.id = `row_${rowCounter}`;

        let tdName = `<td><input type="text" class="form-control student-name" placeholder="이름 입력"></td>`;
        tr.innerHTML += tdName;

        currentEvaluationItems.forEach((item, index) => {
            let tdRadio = `<td>
                <div class="radio-group">
                    <label><input type="radio" name="item_${rowCounter}_${index}" value="상" checked> 상</label>
                    <label><input type="radio" name="item_${rowCounter}_${index}" value="중"> 중</label>
                    <label><input type="radio" name="item_${rowCounter}_${index}" value="하"> 하</label>
                </div>
            </td>`;
            tr.innerHTML += tdRadio;
        });

        let tdTail = `<td><input type="text" class="form-control custom-memo" placeholder="예: 집중력이 좋음"></td>
        <td class="text-center"><button class="btn btn-danger btn-sm" onclick="document.getElementById('row_${rowCounter}').remove()">삭제</button></td>`;
        tr.innerHTML += tdTail;

        tbody.appendChild(tr);
    }

    // ZIP 압축 파일 빌드 엔진
    async function generateAndZip() {
        const className = document.getElementById("className").value.trim();
        const textbookSelect = document.getElementById("textbookSelect");
        
        if(!textbookSelect.value) { alert("교재를 선택해 주세요!"); return; }
        const textbookName = textbookSelect.options[textbookSelect.selectedIndex].text;
        
        if(!className) { alert("1번 '수업반 이름'을 입력해 주세요!"); return; }
        
        const rows = document.querySelectorAll(".student-row");
        if(rows.length === 0) { alert("출력할 학생 데이터가 없습니다."); return; }

        const zip = new JSZip();
        let hasValidFile = false;

        for (let i = 0; i < rows.length; i++) {
            const row = rows[i];
            const studentName = row.querySelector(".student-name").value.trim();
            if(!studentName) continue; 

            hasValidFile = true;

            let combinedFeedback = "";
            currentEvaluationItems.forEach((item, idx) => {
                const rName = `item_${row.id.split('_')[1]}_${idx}`;
                const checkedRadio = row.querySelector(`input[name="${rName}"]:checked`);
                const checkedLevel = checkedRadio ? checkedRadio.value : "상";
                const text = (evaluationPoolData[item] && evaluationPoolData[item][checkedLevel]) ? evaluationPoolData[item][checkedLevel] : "";
                combinedFeedback += text + " ";
            });

            const customMemo = row.querySelector(".custom-memo").value.trim();

            const doc = new docx.Document({
                sections: [{
                    children: [
                        new docx.Paragraph({
                            alignment: docx.AlignmentType.CENTER,
                            heading: docx.HeadingLevel.HEADING_1,
                            children: [new docx.TextRun({ text: "🚀 방과후 컴퓨터 교실 학습 피드백 안내문", bold: true, size: 32 })]
                        }),
                        new docx.Paragraph({ children: [new docx.TextRun("")] }),
                        new docx.Paragraph({ children: [new docx.TextRun({ text: `▶ 수업반 정보 : ${className}`, size: 24 })] }),
                        new docx.Paragraph({ children: [new docx.TextRun({ text: `▶ 학생 성명 : ${studentName} 학생 귀하`, size: 24 })] }),
                        new docx.Paragraph({ children: [new docx.TextRun({ text: `▶ 학습 과정 : ${textbookName}`, size: 24 })] }),
                        new docx.Paragraph({ children: [new docx.TextRun("")] }),
                        new docx.Paragraph({
                            heading: docx.HeadingLevel.HEADING_2,
                            children: [new docx.TextRun({ text: "[종합 교육 성취도 피드백]", bold: true, size: 26 })]
                        }),
                        new docx.Paragraph({ children: [new docx.TextRun({ text: combinedFeedback, size: 22 })] }),
                        new docx.Paragraph({ children: [new docx.TextRun("")] }),
                        new docx.Paragraph({ children: [new docx.TextRun({ text: customMemo ? `[지도강사 개별 의견]
- ${customMemo}` : "", size: 22 })] }),
                        new docx.Paragraph({ children: [new docx.TextRun("")] }),
                        new docx.Paragraph({
                            alignment: docx.AlignmentType.CENTER,
                            children: [new docx.TextRun({ text: "정보통신 역량을 갖춘 미래 인재로 성장할 수 있도록 가정에서도 많은 격려 부탁드립니다.", size: 20 })]
                        }),
                        new docx.Paragraph({
                            alignment: docx.AlignmentType.CENTER,
                            children: [new docx.TextRun({ text: "방과후 컴퓨터 교실 지도강사 드림", size: 20, bold: true })]
                        })
                    ]
                }]
            });

            const blob = await docx.Packer.toBlob(doc);
            zip.file(`${studentName}_학습통지서.docx`, blob);
        }

        if(!hasValidFile) {
            alert("학생 이름을 최소 한 명 이상 입력하셔야 파일이 생성됩니다!");
            return;
        }

        zip.generateAsync({type:"blob"}).then(function(content) {
            saveAs(content, `${className}_학습통지서_일괄출력.zip`);
        }).catch(err => alert("압축 파일 생성 중 오류 발생: " + err));
    }
</script>
</body>
</html>
